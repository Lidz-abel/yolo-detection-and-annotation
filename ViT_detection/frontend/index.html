<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YOLO 检测工具</title>
    <link rel="stylesheet" href="/frontend/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">Y</div>
          <div>
            <h1>YOLO 检测工具</h1>
            <p>上传图片、目标检测、结果修正与 YOLO txt 导出</p>
          </div>
        </div>
        <div class="status-strip">
          <span id="apiStatus" class="status-dot idle"></span>
          <span id="apiStatusText">后端未检测</span>
        </div>
      </header>

      <main class="workspace">
        <section class="stage">
          <div class="stage-toolbar">
            <label class="file-button">
              <input id="imageInput" type="file" accept="image/*" />
              <span>上传图片</span>
            </label>
            <button id="predictButton" class="primary-button" type="button" disabled>运行检测</button>
            <button id="addBoxButton" class="ghost-button" type="button" disabled>新增框</button>
            <button id="fitButton" class="icon-button" type="button" title="适配视图" disabled>Fit</button>
          </div>

          <div id="canvasShell" class="canvas-shell empty">
            <div id="emptyState" class="empty-state">
              <div class="empty-title">上传一张图片开始检测</div>
              <div class="empty-copy">检测结果会显示类别、置信度和 bbox，可修正后导出 YOLO txt。</div>
            </div>
            <div id="imageViewport" class="image-viewport">
              <img id="previewImage" alt="待标注图片" />
              <div id="boxLayer" class="box-layer"></div>
            </div>
          </div>
        </section>

        <aside class="side-panel">
          <section class="panel-section">
            <div class="section-title">
              <h2>推理设置</h2>
              <button id="healthButton" class="small-button" type="button">检测后端</button>
            </div>
            <label class="field">
              <span>后端地址</span>
              <input id="apiBaseInput" type="text" placeholder="同源或 http://127.0.0.1:5000" />
            </label>
            <div class="field-grid">
              <label class="field">
                <span>置信度</span>
                <input id="scoreInput" type="number" min="0" max="1" step="0.01" value="0.05" />
              </label>
              <label class="field">
                <span>Top K</span>
                <input id="topKInput" type="number" min="1" step="1" value="100" />
              </label>
              <label class="field">
                <span>NMS IoU</span>
                <input id="nmsInput" type="number" min="0" max="1" step="0.01" value="0.5" />
              </label>
            </div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>图片信息</h2>
            </div>
            <dl class="info-list">
              <div><dt>文件</dt><dd id="imageName">未上传</dd></div>
              <div><dt>尺寸</dt><dd id="imageSize">-</dd></div>
              <div><dt>框数量</dt><dd id="boxCount">0</dd></div>
              <div><dt>模型</dt><dd id="modelInfo">未加载</dd></div>
              <div><dt>设备</dt><dd id="deviceInfo">-</dd></div>
              <div><dt>耗时</dt><dd id="latencyInfo">-</dd></div>
            </dl>
          </section>

          <section class="panel-section grow">
            <div class="section-title">
              <h2>检测结果</h2>
              <button id="deleteButton" class="danger-button" type="button" disabled>删除</button>
            </div>
            <div id="boxList" class="box-list"></div>
          </section>

          <section class="panel-section">
            <div class="section-title">
              <h2>选中框</h2>
            </div>
            <div id="editorEmpty" class="editor-empty">请选择一个 bbox。</div>
            <form id="boxEditor" class="box-editor hidden">
              <div class="field-grid two">
                <label class="field">
                  <span>Class ID</span>
                  <input id="classIdInput" type="number" min="0" step="1" />
                </label>
                <label class="field">
                  <span>Score</span>
                  <input id="scoreReadout" type="text" disabled />
                </label>
              </div>
              <div class="field-grid two">
                <label class="field"><span>X1</span><input id="x1Input" type="number" step="1" /></label>
                <label class="field"><span>Y1</span><input id="y1Input" type="number" step="1" /></label>
                <label class="field"><span>X2</span><input id="x2Input" type="number" step="1" /></label>
                <label class="field"><span>Y2</span><input id="y2Input" type="number" step="1" /></label>
              </div>
            </form>
          </section>

          <section class="panel-section">
            <button id="saveButton" class="confirm-button" type="button" disabled>保存检测结果</button>
            <a id="downloadLink" class="download-link hidden" download>下载本地 txt 副本</a>
            <p id="saveMessage" class="save-message"></p>
          </section>
        </aside>
      </main>
    </div>

    <script src="/frontend/app.js"></script>
  </body>
</html>
