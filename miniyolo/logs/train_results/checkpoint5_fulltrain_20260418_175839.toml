# Base training config for checkpoint 5.

[data]
train_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_train.jsonl"
val_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_val.jsonl"
image_size = 224
grid_size = 7
num_classes = 80
train_max_samples = 200000
val_max_samples = 200000

[model]
lambda_cls = 1.0
lambda_box = 5.0

[train]
batch_size = 256
num_workers = 64
epochs = 20
lr = 0.001
min_lr = 0.00001
scheduler = "cosine"
shuffle = true
seed = 42
device = "auto"
pin_memory = true
persistent_workers = true
prefetch_factor = 4
use_data_parallel = true

[logging]
run_name = "checkpoint5_fulltrain"
log_every_steps = 20
grad_log_interval_steps = 100
runs_dir = "/home/lidz/YOLO/miniyolo/runs"
output_dir = "/home/lidz/YOLO/miniyolo/outputs/checkpoint5"
results_dir = "/home/lidz/YOLO/miniyolo/logs/train_results"

[evaluation]
eval_interval_epochs = 5
map_iou_threshold = 0.5
eval_top_k = 3
eval_score_threshold = 0.0

[visualization]
vis_interval_epochs = 5
max_visualization_samples = 4
