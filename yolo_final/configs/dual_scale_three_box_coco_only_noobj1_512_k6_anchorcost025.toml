# COCO-only improvement config: 512 resolution, COCO train k=6 anchors,
# p4/p5, dynamic anchor shape prior, 50 epochs.

[data]
train_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/coco2017_train.jsonl"
val_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/coco2017_val.jsonl"
packing_format = "pt"
packed_root = "/home/lidz/YOLO/DataSet/Unified/packed"
packed_chunk_size = 1024
packed_cache_size = 4
image_size = 512
grid_sizes = "32,16"
num_classes = 80
train_max_samples = 0
val_max_samples = 0

[model]
name = "deep_residual_dual_scale_three_box"
width_mult = 1.0
depth_mult = 2.0
use_residual = true
head_type = "decoupled"
neck_type = "fpn_pan_lite"
feature_levels = "p4,p5"
num_boxes = 3
anchors_p4 = "0.036285,0.055877;0.111450,0.147769;0.164450,0.389010"
anchors_p5 = "0.405962,0.224980;0.372495,0.618863;0.804661,0.727088"
box_parameterization = "yolov5"

[loss]
box_type = "giou"
cls_type = "bce"
use_objectness = true
iou_loss = "giou"
soft_objectness_target = "iou"
soft_objectness_min = 0.05
soft_classification_target = "iou"
cls_loss_mode = "quality_bce"
assignment_strategy = "dynamic_cost"
dynamic_topk = 2
dynamic_center_radius = 1
dynamic_box_cost = 3.0
dynamic_cls_cost = 1.0
dynamic_ignore_iou = 0.5
dynamic_anchor_shape_cost = 0.25
lambda_box = 5.0
lambda_obj = 1.0
lambda_noobj = 1.0
lambda_cls = 1.0

[train]
batch_size = 128
epochs = 50
optimizer = "adamw"
lr = 0.001
min_lr = 0.00001
weight_decay = 0.0001
scheduler = "cosine"
shuffle = true
seed = 42
device = "auto"
num_workers = 64
pin_memory = true
persistent_workers = true
prefetch_factor = 4
use_data_parallel = true
max_steps_per_epoch = 0
max_val_steps = 0

[logging]
run_name = "dual_scale_three_box_coco_only_noobj1_512_k6_anchorcost025"
runs_dir = "runs"
output_dir = "outputs"
records_dir = "logs/records"
log_every_steps = 20
save_interval_epochs = 5

[evaluation]
val_interval_epochs = 1
score_threshold = 0.05
score_alpha = 2.0
score_beta = 1.0
top_k = 100
nms_iou_threshold = 0.5
map_iou_threshold = 0.5

[visualization]
vis_interval_epochs = 5
max_samples = 4
score_threshold = 0.25
score_alpha = 2.0
score_beta = 1.0
top_k = 12
