# Formal Stage-C round-6B variant: roll back to the stronger Round 5C
# dynamic assignment and add denser varifocal-style classification.

[data]
train_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_train.jsonl"
val_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_val.jsonl"
packing_format = "pt"
image_size = 320
grid_size = 10
num_classes = 80
train_max_samples = 0
val_max_samples = 0

[model]
name = "deep_residual"
width_mult = 1.0
depth_mult = 2.0
use_residual = true
head_type = "decoupled"
num_boxes = 3
anchors = "0.052141,0.076305;0.199926,0.288289;0.609263,0.649287"
anchor_positive_iou = 0.25
anchor_ignore_iou = 0.5
anchor_match_metric = "shape_ratio"
anchor_shape_ratio = 2.5
anchor_ignore_shape_ratio = 4.0
box_parameterization = "yolov5"

[loss]
box_type = "giou"
cls_type = "bce"
use_objectness = true
iou_loss = "giou"
soft_objectness_target = "iou"
soft_objectness_min = 0.05
soft_classification_target = "iou"
cls_loss_mode = "varifocal"
varifocal_alpha = 0.75
varifocal_gamma = 2.0
assignment_strategy = "dynamic_cost"
dynamic_topk = 2
dynamic_center_radius = 1
dynamic_box_cost = 3.0
dynamic_cls_cost = 1.0
dynamic_ignore_iou = 0.5
lambda_box = 5.0
lambda_obj = 1.0
lambda_noobj = 0.5
lambda_cls = 1.0

[train]
batch_size = 256
epochs = 20
optimizer = "adamw"
lr = 0.001
min_lr = 0.00001
weight_decay = 0.0001
scheduler = "cosine"
shuffle = true
seed = 42
device = "auto"
num_workers = 64
pin_memory = true
persistent_workers = true
prefetch_factor = 4
use_data_parallel = true
max_steps_per_epoch = 0
max_val_steps = 0

[logging]
run_name = "deep_residual_three_box_dynamicassign_varifocal"
runs_dir = "runs"
output_dir = "outputs"
records_dir = "logs/records"
log_every_steps = 20
save_interval_epochs = 5

[evaluation]
val_interval_epochs = 1
score_threshold = 0.05
score_alpha = 1.0
score_beta = 1.0
top_k = 100
nms_iou_threshold = 0.5
map_iou_threshold = 0.5

[visualization]
vis_interval_epochs = 5
max_samples = 4
score_threshold = 0.25
score_alpha = 1.0
score_beta = 1.0
top_k = 12
