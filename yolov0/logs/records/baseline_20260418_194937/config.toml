# Conservative baseline training config for yolov0 stage one.

[data]
train_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_train.jsonl"
val_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_val.jsonl"
image_size = 320
grid_size = 10
num_classes = 80
train_max_samples = 65536
val_max_samples = 4096
packing_format = "pt"

[model]
name = "baseline_cnn"
width_mult = 1.0
depth_mult = 1.0
use_residual = false

[loss]
box_type = "mse"
cls_type = "mse"
use_objectness = false
iou_loss = "none"
lambda_box = 5.0
lambda_cls = 1.0

[train]
batch_size = 128
epochs = 50
optimizer = "adamw"
lr = 0.001
min_lr = 0.00001
weight_decay = 0.0001
scheduler = "cosine"
shuffle = true
seed = 42
device = "auto"
num_workers = 48
pin_memory = true
persistent_workers = true
prefetch_factor = 4
use_data_parallel = true
bootstrap_only = true

[logging]
run_name = "baseline"
runs_dir = "/home/lidz/YOLO/yolov0/runs"
output_dir = "/home/lidz/YOLO/yolov0/outputs"
records_dir = "/home/lidz/YOLO/yolov0/logs/records"
log_every_steps = 20

[evaluation]
eval_interval_epochs = 5
map_iou_threshold = 0.5
score_threshold = 0.05
top_k = 10

[visualization]
vis_interval_epochs = 5
max_samples = 4
