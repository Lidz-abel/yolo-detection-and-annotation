# Formal config for Stage A.
# This run upgrades deep_cnn to a single-box full YOLO-style loss with objectness and GIoU.

[data]
train_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_train.jsonl"
val_manifest = "/home/lidz/YOLO/DataSet/Unified/manifests/all_val.jsonl"
image_size = 320
grid_size = 10
num_classes = 80
train_max_samples = 0
val_max_samples = 0
packing_format = "pt"

[model]
name = "deep_cnn"
width_mult = 1.0
depth_mult = 2.0
use_residual = false
num_boxes = 1

[loss]
box_type = "giou"
cls_type = "bce"
use_objectness = true
iou_loss = "giou"
lambda_box = 5.0
lambda_obj = 1.0
lambda_noobj = 0.5
lambda_cls = 1.0

[train]
batch_size = 256
epochs = 20
optimizer = "adamw"
lr = 0.001
min_lr = 0.00001
weight_decay = 0.0001
scheduler = "cosine"
shuffle = true
seed = 42
device = "auto"
num_workers = 64
pin_memory = true
persistent_workers = true
prefetch_factor = 4
use_data_parallel = true
max_steps_per_epoch = 0
max_val_steps = 0

[logging]
run_name = "deep_cnn_single_box_full_loss"
runs_dir = "/home/lidz/YOLO/yolov0/runs"
output_dir = "/home/lidz/YOLO/yolov0/outputs"
records_dir = "/home/lidz/YOLO/yolov0/logs/records"
log_every_steps = 20
save_interval_epochs = 5

[evaluation]
val_interval_epochs = 1

[visualization]
vis_interval_epochs = 5
max_samples = 4
score_threshold = 0.05
top_k = 10
